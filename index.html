<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171b">
<title>Katalog urządzeń elektrycznych</title>

<!-- Instalacja na ekranie głównym telefonu -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Katalog">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  /* Motyw ustawiamy przed narysowaniem strony, żeby przy jasnym motywie
     nie mrugnęło na moment ciemne tło. Domyślny motyw: ciemny. */
  (function () {
    var zapisany;
    try { zapisany = localStorage.getItem('motyw'); } catch (e) { zapisany = null; }
    document.documentElement.setAttribute('data-theme', zapisany === 'light' ? 'light' : 'dark');
  })();
</script>
<style>
  /* ============================================================
     TOKENY DESIGNU
     Paleta inspirowana oznaczeniami "Uwaga! Wysokie napięcie":
     grafitowe tło (jak obudowa rozdzielnicy) + żółte pasy ostrzegawcze.
  ============================================================ */

  /* --- Motyw ciemny (domyślny) --- */
  :root {
    --bg: #14171b;
    --surface: #1e2226;
    --surface-2: #262b30;
    --border: #33393f;
    --text: #eef1f3;
    --text-dim: #9aa3ab;
    --yellow: #ffc400;          /* wypełnienia: przyciski, pasy ostrzegawcze */
    --accent-text: #ffc400;     /* żółty jako tekst (symbole, nagłówek) */
    --on-yellow: #1a1400;       /* tekst na żółtym tle */
    --red: #e5484d;
    --green: #3ecf5a;
    --hazard-dark: #14171b;
    --hero-fade: rgba(20,23,27,0.38);
    --danger-bg: #4a1f21;
    --danger-text: #ffb4b6;
    --alert-bg: #4a1f21;
    --alert-text: #ffd7d8;
    --info-bg: #1c2b1f;
    --info-text: #c8f3d3;
    --ok-bg: rgba(62,207,90,0.12);
    --ok-text: #3ecf5a;
    --bad-bg: rgba(229,72,77,0.14);
    --bad-text: #ff8b8f;
    --warn-bg: rgba(255,196,0,0.14);
    --warn-text: #ffc400;
    --card-shadow: none;
    --radius: 10px;
  }

  /* --- Motyw jasny (do wyboru) --- */
  :root[data-theme="light"] {
    --bg: #f2f4f6;
    --surface: #ffffff;
    --surface-2: #eef1f4;
    --border: #d5dbe1;
    --text: #12171c;
    --text-dim: #5c6771;
    --yellow: #ffc400;
    --accent-text: #8a6100;     /* ciemniejszy bursztyn — czytelny na bieli */
    --on-yellow: #1a1400;
    --red: #d13b40;
    --green: #1a7f37;
    --hazard-dark: #1a1d21;
    --hero-fade: rgba(242,244,246,0.38);
    --danger-bg: #fdecec;
    --danger-text: #a3231d;
    --alert-bg: #fdecec;
    --alert-text: #8c1d18;
    --info-bg: #e8f6ed;
    --info-text: #14532d;
    --ok-bg: #e6f6ea;
    --ok-text: #1a7f37;
    --bad-bg: #fdecec;
    --bad-text: #a3231d;
    --warn-bg: #fdf3d6;
    --warn-text: #7a5600;
    --card-shadow: 0 1px 2px rgba(18,23,28,0.06);
  }

  html { color-scheme: dark; }
  :root[data-theme="light"] { color-scheme: light; }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    padding-bottom: 84px; /* miejsce na dolny pasek */
    min-height: 100vh;
  }

  /* Zdjęcie nagłówkowe — responsywne, bez przycinania */
  .hero { width: 100%; line-height: 0; position: relative; }
  .hero img { width: 100%; height: auto; display: block; }

  /* Znak ostrzegawczy w prawym górnym rogu zdjęcia.
     Pełni też rolę przełącznika motywu jasny / ciemny. */
  .hero .znak {
    position: absolute;
    top: calc(12px + env(safe-area-inset-top, 0px));
    right: 12px;
    width: clamp(66px, 17vw, 98px);
    padding: 0;
    border: none;
    background: transparent;
    line-height: 0;
    z-index: 2;
    cursor: pointer;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
    transition: transform 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .hero .znak svg { width: 100%; height: auto; display: block; }
  .hero .znak:active {
    transform: scale(0.93);
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5)) brightness(0.92);
  }
  .hero .znak:focus-visible {
    outline: 3px solid var(--yellow);
    outline-offset: 5px;
    border-radius: 6px;
  }
  .hero::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 75%, var(--hero-fade) 100%);
    pointer-events: none;
  }

  /* Pasek ostrzegawczy */
  .hazard-strip {
    height: 6px;
    width: 100%;
    background: repeating-linear-gradient(
      135deg,
      var(--yellow) 0 16px,
      var(--hazard-dark) 16px 32px
    );
  }

  header.top {
    padding: 18px 16px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header.top .top-text { flex: 1; min-width: 0; }
  header.top h1 {
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 0.03em;
    font-size: 26px;
    margin: 0 0 2px;
    color: var(--accent-text);
  }
  header.top p { margin: 0; font-size: 13px; color: var(--text-dim); }

  /* Pasek trybu offline */
  #offline-bar {
    background: var(--warn-bg);
    color: var(--warn-text);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
  }

  main { padding: 16px; max-width: 720px; margin: 0 auto; }

  /* ---------- Pola formularzy ---------- */
  input, select, textarea {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 16px;      /* 16px zapobiega automatycznemu zoomowi na iPhone */
    font-family: inherit;
  }
  input::placeholder, textarea::placeholder { color: var(--text-dim); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--yellow); }
  label.field { display: block; margin-bottom: 12px; }
  label.field span {
    display: block;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    margin-bottom: 6px;
  }

  /* ---------- Przyciski ---------- */
  button {
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    border-radius: 8px;
    border: none;
    padding: 12px 16px;
    cursor: pointer;
    transition: filter 0.15s ease;
  }
  button:active { filter: brightness(0.88); }
  .btn-primary { background: var(--yellow); color: var(--on-yellow); width: 100%; }
  .btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--red); }
  .btn-ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); }
  .btn-block { width: 100%; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row button { flex: 1; }

  /* ---------- Wyszukiwarka ---------- */
  .search-row { position: relative; margin-bottom: 12px; }
  .search-row input { padding-right: 46px; }
  #search-clear {
    position: absolute;
    right: 6px; top: 50%;
    transform: translateY(-50%);
    width: 34px; height: 34px;
    padding: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--text-dim);
    font-size: 17px;
    border: none;
  }

  /* ---------- Zakładki ---------- */
  .tab-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .tab-btn {
    position: relative;
    background: var(--surface);
    box-shadow: var(--card-shadow);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 14px 10px;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: center;
  }
  .tab-btn.active { background: var(--yellow); color: var(--on-yellow); border-color: var(--yellow); }
  .tab-badge {
    position: absolute;
    top: -6px; right: -6px;
    min-width: 22px; height: 22px;
    padding: 0 6px;
    border-radius: 11px;
    background: var(--red);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid var(--bg);
  }
  .tab-badge.soon { background: var(--yellow); color: var(--on-yellow); }

  /* ---------- Karty ---------- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--yellow);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--card-shadow);
  }
  .card.termopara-bad { border-left-color: var(--red); }
  .card.termopara-soon { border-left-color: var(--yellow); }
  .card .symbol {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 0.03em;
    color: var(--accent-text);
    line-height: 1;
  }
  .card .nazwa { font-size: 15px; color: var(--text); margin: 4px 0 12px; }

  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .meta-grid .full { grid-column: 1 / -1; }
  .meta-block { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
  .meta-block .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin-bottom: 3px;
  }
  .meta-block .value { font-size: 14px; font-weight: 600; }

  .card .footer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
    margin-bottom: 10px;
  }

  /* ---------- Zdjęcia na karcie ---------- */
  .photo-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .photo-row img {
    width: 76px; height: 76px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border);
    display: block;
    cursor: zoom-in;
  }

  /* ---------- Edytor zdjęć w formularzu ---------- */
  .photo-picker { margin-bottom: 14px; }
  .photo-thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .photo-thumb { position: relative; width: 76px; height: 76px; }
  .photo-thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border);
    display: block;
  }
  .photo-remove {
    position: absolute;
    top: -6px; right: -6px;
    width: 22px; height: 22px;
    padding: 0;
    border-radius: 50%;
    background: var(--red);
    color: #fff;
    font-size: 12px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Etykiety <label> udające przyciski — <button> ma własny padding,
     więc etykietom trzeba go dołożyć, żeby miały tę samą wysokość. */
  .photo-add-label, .file-label {
    display: block;
    text-align: center;
    cursor: pointer;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
  }

  /* ---------- Podgląd zdjęcia na wierzchu strony ---------- */
  #lightbox {
    position: fixed;
    inset: 0;
    background: rgba(8,10,12,0.94);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  #lightbox img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 8px;
  }
  #lightbox .lb-close {
    position: absolute;
    top: calc(12px + env(safe-area-inset-top, 0px));
    right: 12px;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.14);
    color: #fff;
    font-size: 20px;
    padding: 0;
  }
  #lightbox .lb-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px; height: 60px;
    border-radius: 8px;
    background: rgba(255,255,255,0.14);
    color: #fff;
    font-size: 24px;
    padding: 0;
  }
  #lightbox .lb-prev { left: 10px; }
  #lightbox .lb-next { right: 10px; }
  #lightbox .lb-count {
    position: absolute;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    left: 0; right: 0;
    text-align: center;
    color: rgba(255,255,255,0.75);
    font-size: 13px;
  }
  body.lb-open { overflow: hidden; }

  /* ---------- Dolny pasek ---------- */
  .bottom-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--text-dim);
    z-index: 10;
  }
  .bottom-bar b { color: var(--text); }
  .bottom-bar button { padding: 8px 12px; font-size: 13px; flex: none; }

  h2.section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 0.02em;
    margin: 0;
  }

  .row-between {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    gap: 10px;
  }

  /* ---------- Sortowanie ---------- */
  .sort-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }
  .sort-row label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .sort-row select { padding: 9px 12px; font-size: 14px; }

  .empty-state { text-align: center; color: var(--text-dim); padding: 40px 20px; font-size: 14px; }

  /* ---------- Import / eksport CSV ---------- */
  .csv-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
  @media (min-width: 430px) { .csv-grid { grid-template-columns: 1fr 1fr; } }
  .import-sum { margin-top: 14px; }
  .import-sum .podsumowanie {
    background: var(--surface-2);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 13px;
    margin-bottom: 10px;
  }
  .import-sum .podsumowanie b { color: var(--text); }
  .import-sum ul { margin: 8px 0 0; padding-left: 18px; color: var(--bad-text); }
  .import-sum li { margin-bottom: 3px; }

  .stat-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .stat-chips span {
    background: var(--surface-2);
    color: var(--text-dim);
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 999px;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--ok-bg);
    color: var(--ok-text);
    white-space: nowrap;
  }
  .status-pill.bad { background: var(--bad-bg); color: var(--bad-text); }
  .status-pill.soon { background: var(--warn-bg); color: var(--warn-text); }
  .status-pill.count { background: var(--surface-2); color: var(--text-dim); }
  .status-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  .alert {
    background: var(--alert-bg);
    border: 1px solid var(--red);
    color: var(--alert-text);
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 14px;
  }
  .alert.info { background: var(--info-bg); border-color: var(--green); color: var(--info-text); }

  .admin-section {
    background: var(--surface);
    box-shadow: var(--card-shadow);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
  }
  .admin-section h3 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 19px;
    letter-spacing: 0.02em;
    margin: 0 0 4px;
  }
  .admin-section p.hint { color: var(--text-dim); font-size: 13px; margin: 0 0 14px; }

  /* ---------- Wyniki wyszukiwania ---------- */
  .result-group { margin-bottom: 8px; }
  .result-group > h3 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 19px;
    letter-spacing: 0.02em;
    margin: 18px 0 10px;
    color: var(--text-dim);
  }

  .hidden { display: none !important; }
  a.link { color: var(--accent-text); text-decoration: none; }
</style>
</head>
<body>

<div class="hero">
<button id="theme-toggle" class="znak" type="button" title="Przełącz na motyw jasny" aria-label="Przełącz na motyw jasny">
  <svg viewBox="0 0 100 92" aria-hidden="true" focusable="false">
    <polygon points="50,7 95,85 5,85" fill="#f2c31e" stroke="#111" stroke-width="8" stroke-linejoin="round"/>
    <polygon points="52,33 62,33 47,53 59,51 50,64 59,64 45,79 31,64 41,64 50,51 38,53" fill="#111"/>

/* ================================================================
   POMOCNICZE
================================================================ */
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replaceAll('&', '&amp;').replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;').replaceAll('"', '&quot;');
}

function formatDateTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('pl-PL') + ', ' + d.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });
}

function formatDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString('pl-PL');
}

function addDays(dateStr, days) {
  const d = new Date(dateStr);
  d.setDate(d.getDate() + Number(days));
  return d;
}

function daysBetween(a, b) {
  return Math.round((a - b) / (1000 * 60 * 60 * 24));
}

/* Porównywanie tekstu bez względu na wielkość liter i polskie znaki,
   żeby "lacznik" znalazł też "Łącznik". */
function uprosc(tekst) {
  return String(tekst ?? '')
    .toLowerCase()
    .replaceAll('ł', 'l')
    .normalize('NFD').replace(/[̀-ͯ]/g, '');
}

function porownajTekst(a, b) {
  return String(a ?? '').localeCompare(String(b ?? ''), 'pl', { numeric: true, sensitivity: 'base' });
}

function porownajDaty(a, b) {
  return new Date(b || 0) - new Date(a || 0); // najnowsze pierwsze
}

/* Numer z kodu rozdzielni ("T21" → 21), żeby T9 było przed T21. */
function numerKodu(kod) {
  const m = String(kod || '').match(/\d+/);
  return m ? parseInt(m[0], 10) : Number.MAX_SAFE_INTEGER;
}

function showAlert(message, type = 'error') {
  els.globalAlert.innerHTML = `<div class="alert ${type === 'info' ? 'info' : ''}">${escapeHtml(message)}</div>`;
  setTimeout(() => { els.globalAlert.innerHTML = ''; }, 5000);
}

function isLoggedIn() { return !!session; }

function nowyIdentyfikator() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

/* ================================================================
   MOTYW JASNY / CIEMNY
================================================================ */
function ustawMotyw(motyw, zapamietaj) {
  const jasny = motyw === 'light';
  document.documentElement.setAttribute('data-theme', jasny ? 'light' : 'dark');
  // Przełącznikiem jest znak ostrzegawczy w rogu zdjęcia — zmieniamy mu tylko opis.
  const przycisk = document.getElementById('theme-toggle');
  if (przycisk) {
    przycisk.title = jasny ? 'Przełącz na motyw ciemny' : 'Przełącz na motyw jasny';
    przycisk.setAttribute('aria-label', przycisk.title);
  }
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', jasny ? '#f2f4f6' : '#14171b');
  if (zapamietaj) {
    try { localStorage.setItem('motyw', jasny ? 'light' : 'dark'); } catch (e) { /* tryb prywatny */ }
  }
}

function initMotyw() {
  let zapisany = null;
  try { zapisany = localStorage.getItem('motyw'); } catch (e) { /* tryb prywatny */ }
  ustawMotyw(zapisany === 'light' ? 'light' : 'dark', false);
  document.getElementById('theme-toggle').addEventListener('click', () => {
    const terazJasny = document.documentElement.getAttribute('data-theme') === 'light';
    ustawMotyw(terazJasny ? 'dark' : 'light', true);
  });
}

/* ================================================================
   POZYCJA PRZEWIJANIA
   Przy przerysowaniu listy podmieniana jest cała jej zawartość, przez co
   strona "skakała" na początek. Zapamiętujemy pozycję i wracamy na nią.
================================================================ */
let pozycjaDoPrzywrocenia = 0;
let pozycjaZapisana = false;

function zapiszPozycje(naGore) {
  if (pozycjaZapisana) return;
  pozycjaZapisana = true;
  pozycjaDoPrzywrocenia = naGore ? 0 : (window.scrollY || document.documentElement.scrollTop || 0);
}

function przywrocPozycje() {
  const y = pozycjaDoPrzywrocenia;
  pozycjaZapisana = false;
  const ustaw = () => window.scrollTo(0, y);
  ustaw();
  requestAnimationFrame(ustaw);
  setTimeout(ustaw, 120);
}

/* ================================================================
   PODGLĄD ZDJĘCIA NA WIERZCHU STRONY
================================================================ */
let podgladZdjecia = { lista: [], index: 0 };

function otworzPodglad(lista, index) {
  podgladZdjecia = { lista, index };
  document.body.classList.add('lb-open');
  els.lightbox.classList.remove('hidden');
  pokazZdjeciePodgladu();
}

function pokazZdjeciePodgladu() {
  const { lista, index } = podgladZdjecia;
  els.lightbox.querySelector('img').src = lista[index];
  const wiele = lista.length > 1;
  els.lightbox.querySelector('.lb-prev').classList.toggle('hidden', !wiele);
  els.lightbox.querySelector('.lb-next').classList.toggle('hidden', !wiele);
  els.lightbox.querySelector('.lb-count').textContent = wiele ? `${index + 1} / ${lista.length}` : '';
}

function zamknijPodglad() {
  els.lightbox.classList.add('hidden');
  document.body.classList.remove('lb-open');
  els.lightbox.querySelector('img').removeAttribute('src');
}

function przesunPodglad(krok) {
  const n = podgladZdjecia.lista.length;
  podgladZdjecia.index = (podgladZdjecia.index + krok + n) % n;
  pokazZdjeciePodgladu();
}

function initPodglad() {
  // Kliknięcie miniatury gdziekolwiek na liście otwiera podgląd
  els.content.addEventListener('click', (e) => {
    const img = e.target.closest('.photo-row img');
    if (!img) return;
    const wiersz = img.closest('.photo-row');
    const zdjecia = [...wiersz.querySelectorAll('img')];
    otworzPodglad(zdjecia.map(x => x.src), zdjecia.indexOf(img));
  });

  els.lightbox.addEventListener('click', (e) => {
    if (e.target.closest('.lb-prev')) { przesunPodglad(-1); return; }
    if (e.target.closest('.lb-next')) { przesunPodglad(1); return; }
    zamknijPodglad(); // kliknięcie tła, zdjęcia lub ✕ zamyka
  });

  document.addEventListener('keydown', (e) => {
    if (els.lightbox.classList.contains('hidden')) return;
    if (e.key === 'Escape') zamknijPodglad();
    if (e.key === 'ArrowLeft') przesunPodglad(-1);
    if (e.key === 'ArrowRight') przesunPodglad(1);
  });
}

/* ================================================================
   SESJA / LOGOWANIE
================================================================ */
async function initSession() {
  try {
    // Bez zasięgu odświeżanie tokenu potrafi się zaciąć — nie blokujemy startu.
    const wynik = await Promise.race([
      sb.auth.getSession(),
      new Promise(res => setTimeout(() => res({ data: { session: null } }), 5000))
    ]);
    session = wynik?.data?.session || null;
  } catch (e) {
    session = null;
  }
  renderSessionInfo();

  sb.auth.onAuthStateChange((_event, newSession) => {
    const poprzedniUzytkownik = session?.user?.id || null;
    const nowyUzytkownik = newSession?.user?.id || null;
    session = newSession;
    renderSessionInfo();
    // Przerysowujemy TYLKO przy faktycznej zmianie użytkownika — bez tego
    // powrót na kartę przeglądarki przewijał listę na górę.
    if (poprzedniUzytkownik !== nowyUzytkownik) render({ naGore: true });
  });
}

function renderSessionInfo() {
  els.sessionInfo.innerHTML = isLoggedIn()
    ? `Zalogowano: <b>${escapeHtml(session.user.email)}</b>`
    : 'Tryb podglądu (niezalogowany)';
}

async function login(email, password) {
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { showAlert('Błąd logowania: ' + error.message); return false; }
  return true;
}

async function logout() {
  await sb.auth.signOut();
  showAlert('Wylogowano.', 'info');
  currentTab = 'urzadzenia';
  render({ naGore: true });
}

/* ================================================================
   DANE — jedno pobranie + kopia na czas braku zasięgu
================================================================ */
function czyBladSieci(err) {
  const tekst = String(err?.message || err || '');
  return !navigator.onLine || /failed to fetch|networkerror|load failed|network request failed|timeout/i.test(tekst);
}

function zapiszKopie() {
  try {
    localStorage.setItem(KLUCZ_KOPII, JSON.stringify({ czas: new Date().toISOString(), dane: DANE }));
  } catch (e) { /* brak miejsca lub tryb prywatny — pomijamy */ }
}

function wczytajKopie() {
  try {
    const zapis = JSON.parse(localStorage.getItem(KLUCZ_KOPII) || 'null');
    if (zapis && zapis.dane) return zapis;
  } catch (e) { /* uszkodzona kopia */ }
  return null;
}

async function pobierzWszystko() {
  try {
    const [r, u, t, h, i] = await Promise.all([
      sb.from('rozdzielnie').select('*'),
      sb.from('urzadzenia').select('*'),
      sb.from('termopary').select('*'),
      sb.from('termopary_historia').select('*'),
      sb.from('inne_urzadzenia').select('*')
    ]);
    const blad = r.error || u.error || t.error || h.error || i.error;
    if (blad) throw blad;

    DANE.rozdzielnie = r.data || [];
    DANE.urzadzenia = u.data || [];
    DANE.termopary = t.data || [];
    DANE.termopary_historia = h.data || [];
    DANE.inne_urzadzenia = i.data || [];
    daneZKopii = false;
    czasKopii = null;
    zapiszKopie();
  } catch (err) {
    if (!czyBladSieci(err)) throw err;          // błąd uprawnień itp. pokazujemy wprost
    const zapis = wczytajKopie();
    if (!zapis) throw new Error('Brak połączenia i brak zapisanej kopii danych. Otwórz stronę raz z zasięgiem, żeby pobrać katalog.');
    Object.assign(DANE, zapis.dane);
    daneZKopii = true;
    czasKopii = zapis.czas;
  }
  pokazPasekOffline();
  odswiezOdznakeTermopar();
}

function pokazPasekOffline() {
  if (daneZKopii) {
    els.offlineBar.textContent = `📴 Brak połączenia — dane z ${formatDateTime(czasKopii)}. Zapisywanie zmian jest w tym trybie niemożliwe.`;
    els.offlineBar.classList.remove('hidden');
  } else {
    els.offlineBar.classList.add('hidden');
  }
}

/* Powiązania i liczniki wyliczane z pobranych danych */
function rozdzielniaDla(id) {
  return DANE.rozdzielnie.find(r => r.id === id) || null;
}

function liczbaUrzadzenWRozdzielni(id) {
  return DANE.urzadzenia.filter(u => u.rozdzielnia_id === id).length;
}

function historiaTermopary(id) {
  return DANE.termopary_historia
    .filter(h => h.termopara_id === id)
    .sort((a, b) => new Date(b.data_wymiany) - new Date(a.data_wymiany));
}

/* ================================================================
   TERMOPARY — żywotność i pilność wymiany
================================================================ */
const PROG_ZBLIZA_SIE = 14; // dni

/* Średni odstęp między ostatnimi (maks. 3) wymianami. */
function sredniaZywotnosc(historia) {
  const daty = historia.map(h => new Date(h.data_wymiany)).sort((a, b) => a - b).slice(-3);
  if (daty.length < 2) return null;
  let suma = 0;
  for (let i = 1; i < daty.length; i++) suma += daysBetween(daty[i], daty[i - 1]);
  return Math.round(suma / (daty.length - 1));
}

function stanTermopary(t) {
  const historia = historiaTermopary(t.id);
  const srednia = sredniaZywotnosc(historia);
  const zywotnosc = srednia !== null ? srednia : t.zywotnosc_dni;
  const nastepna = addDays(t.ostatnia_wymiana, zywotnosc);
  const zostalo = daysBetween(nastepna, new Date());
  return {
    historia,
    srednia,
    zywotnosc,
    nastepna,
    zostalo,
    zalegla: zostalo < 0,
    zblizaSie: zostalo >= 0 && zostalo <= PROG_ZBLIZA_SIE
  };
}

function odswiezOdznakeTermopar() {
  let zalegle = 0, wkrotce = 0;
  for (const t of DANE.termopary) {
    const s = stanTermopary(t);
    if (s.zalegla) zalegle++;
    else if (s.zblizaSie) wkrotce++;
  }
  const suma = zalegle + wkrotce;
  if (suma === 0) {
    els.tabBadge.classList.add('hidden');
    return;
  }
  els.tabBadge.textContent = String(suma);
  els.tabBadge.classList.remove('hidden');
  els.tabBadge.classList.toggle('soon', zalegle === 0);
  els.tabBadge.title = zalegle
    ? `${zalegle} zaległych, ${wkrotce} zbliża się`
    : `${wkrotce} zbliża się do wymiany`;
}

/* ================================================================
   NAWIGACJA I SORTOWANIE
================================================================ */
function switchTab(tab, extra) {
  currentTab = tab;
  if (tab === 'urzadzenia' && extra && extra.rozdzielniaId) {
    filtrRozdzielni = extra.rozdzielniaId;
  }
  if (szukanaFraza) { szukanaFraza = ''; els.search.value = ''; els.searchClear.classList.add('hidden'); }
  render({ naGore: true });
}

function updateActiveTabStyles() {
  els.tabButtons.forEach(btn => {
    btn.classList.toggle('active', !szukanaFraza && btn.dataset.tab === currentTab);
  });
}

function wczytajSortowanie() {
  try {
    const zapis = JSON.parse(localStorage.getItem('sortowanie') || 'null');
    if (zapis) sortowanie = { ...DOMYSLNE_SORTOWANIE, ...zapis };
  } catch (e) { /* pomijamy */ }
}

function zapiszSortowanie() {
  try { localStorage.setItem('sortowanie', JSON.stringify(sortowanie)); } catch (e) { /* pomijamy */ }
}

function sortRowHtml(zakladka) {
  const opcje = OPCJE_SORTOWANIA[zakladka].map(([wartosc, etykieta]) =>
    `<option value="${wartosc}" ${sortowanie[zakladka] === wartosc ? 'selected' : ''}>${etykieta}</option>`
  ).join('');
  return `
    <div class="sort-row">
      <label for="sort-select">Sortuj</label>
      <select id="sort-select" data-zakladka="${zakladka}">${opcje}</select>
    </div>`;
}

function bindSortRow() {
  const select = document.getElementById('sort-select');
  if (!select) return;
  select.addEventListener('change', (e) => {
    sortowanie[e.target.dataset.zakladka] = e.target.value;
    zapiszSortowanie();
    render({ bezPobierania: true });
  });
}

function posortujUrzadzenia(lista) {
  const kopia = [...lista];
  const tryb = sortowanie.urzadzenia;
  if (tryb === 'symbol') kopia.sort((a, b) => porownajTekst(a.symbol, b.symbol));
  else if (tryb === 'rozdzielnia') kopia.sort((a, b) => {
    const ra = rozdzielniaDla(a.rozdzielnia_id), rb = rozdzielniaDla(b.rozdzielnia_id);
    return (numerKodu(ra?.kod) - numerKodu(rb?.kod)) || porownajTekst(a.symbol, b.symbol);
  });
  else kopia.sort((a, b) => porownajDaty(a.created_at, b.created_at));
  return kopia;
}

function posortujRozdzielnie(lista) {
  const kopia = [...lista];
  const tryb = sortowanie.rozdzielnie;
  if (tryb === 'liczba') kopia.sort((a, b) =>
    (liczbaUrzadzenWRozdzielni(b.id) - liczbaUrzadzenWRozdzielni(a.id)) || (numerKodu(a.kod) - numerKodu(b.kod)));
  else if (tryb === 'najnowsze') kopia.sort((a, b) => porownajDaty(a.created_at, b.created_at));
  else kopia.sort((a, b) => numerKodu(a.kod) - numerKodu(b.kod));
  return kopia;
}

function posortujTermopary(lista) {
  const kopia = [...lista];
  const tryb = sortowanie.termopary;
  if (tryb === 'symbol') kopia.sort((a, b) => porownajTekst(a.symbol, b.symbol));
  else if (tryb === 'najnowsze') kopia.sort((a, b) => porownajDaty(a.created_at, b.created_at));
  else kopia.sort((a, b) => stanTermopary(a).zostalo - stanTermopary(b).zostalo); // najpilniejsze na górze
  return kopia;
}

function posortujInne(lista) {
  const kopia = [...lista];
  if (sortowanie.inne === 'nazwa') kopia.sort((a, b) => porownajTekst(a.nazwa, b.nazwa));
  else kopia.sort((a, b) => porownajDaty(a.created_at, b.created_at));
  return kopia;
}

/* ================================================================
   RENDER GŁÓWNY
================================================================ */
async function render(opcje = {}) {
  zapiszPozycje(opcje.naGore === true);
  updateActiveTabStyles();
  if (opcje.naGore === true) els.content.innerHTML = '<p class="empty-state">Ładowanie danych…</p>';
  try {
    if (!opcje.bezPobierania) await pobierzWszystko();
    if (szukanaFraza.trim()) renderWyniki();
    else if (currentTab === 'urzadzenia') renderUrzadzenia();
    else if (currentTab === 'rozdzielnie') renderRozdzielnie();
    else if (currentTab === 'termopary') renderTermopary();
    else if (currentTab === 'inne') renderInne();
    else if (currentTab === 'admin') renderAdmin();
  } catch (err) {
    console.error(err);
    els.content.innerHTML = `<div class="alert">Wystąpił błąd podczas wczytywania danych: ${escapeHtml(err.message || err)}</div>`;
  }
  przywrocPozycje();
}

/* ================================================================
   WYSZUKIWARKA OBEJMUJĄCA WSZYSTKIE ZAKŁADKI
================================================================ */
function pasujeDoFrazy(fraza, ...pola) {
  const szukane = uprosc(fraza);
  return pola.some(p => uprosc(p).includes(szukane));
}

function renderWyniki() {
  const fraza = szukanaFraza.trim();

  const urzadzenia = DANE.urzadzenia.filter(u => {
    const r = rozdzielniaDla(u.rozdzielnia_id);
    return pasujeDoFrazy(fraza, u.symbol, u.nazwa, u.uwagi, r?.kod, r?.nazwa);
  });
  const rozdzielnie = DANE.rozdzielnie.filter(r => pasujeDoFrazy(fraza, r.kod, r.nazwa, r.lokalizacja));
  const termopary = DANE.termopary.filter(t => pasujeDoFrazy(fraza, t.symbol, t.nazwa, t.lokalizacja, t.status));
  const inne = DANE.inne_urzadzenia.filter(u => pasujeDoFrazy(fraza, u.symbol, u.nazwa, u.lokalizacja, u.uwagi));

  const razem = urzadzenia.length + rozdzielnie.length + termopary.length + inne.length;

  const grupa = (tytul, lista, html) => lista.length
    ? `<div class="result-group"><h3>${tytul} — ${lista.length}</h3>${lista.map(html).join('')}</div>`
    : '';

  els.content.innerHTML = `
    <div class="row-between">
      <h2 class="section-title">Wyniki: ${razem}</h2>
      <button class="btn-secondary" id="btn-wyczysc-szukanie" style="flex:none;">Wyczyść</button>
    </div>
    ${razem === 0 ? `<p class="empty-state">Nic nie pasuje do „${escapeHtml(fraza)}".</p>` : ''}
    ${grupa('⚡ Urządzenia', posortujUrzadzenia(urzadzenia), urzadzenieCardHtml)}
    ${grupa('🗄️ Rozdzielnie', posortujRozdzielnie(rozdzielnie), rozdzielniaCardHtml)}
    ${grupa('🌡️ Termopary', posortujTermopary(termopary), termoparaCardHtml)}
    ${grupa('📍 Inne urządzenia', posortujInne(inne), inneCardHtml)}
  `;

  document.getElementById('btn-wyczysc-szukanie').addEventListener('click', wyczyscSzukanie);
  bindAkcjeKart();
}

function wyczyscSzukanie() {
  szukanaFraza = '';
  els.search.value = '';
  els.searchClear.classList.add('hidden');
  render({ bezPobierania: true, naGore: true });
}

let licznikSzukania = null;
function initSzukanie() {
  els.search.addEventListener('input', (e) => {
    szukanaFraza = e.target.value;
    els.searchClear.classList.toggle('hidden', !szukanaFraza);
    clearTimeout(licznikSzukania);
    licznikSzukania = setTimeout(() => render({ bezPobierania: true }), 200);
  });
  els.searchClear.addEventListener('click', wyczyscSzukanie);
}

/* ================================================================
   WSPÓLNE AKCJE NA KARTACH (edytuj / usuń / wymiana / pokaż urządzenia)
================================================================ */
function bindAkcjeKart() {
  els.content.querySelectorAll('.card[data-id]').forEach(card => {
    const id = card.dataset.id;
    const typ = card.dataset.typ;
    card.querySelector('.btn-edit')?.addEventListener('click', () => {
      if (typ === 'urzadzenie') showUrzadzenieForm(id);
      else if (typ === 'rozdzielnia') showRozdzielniaForm(id);
      else if (typ === 'termopara') showTermoparaForm(id);
      else if (typ === 'inne') showInneForm(id);
    });
    card.querySelector('.btn-delete')?.addEventListener('click', () => {
      if (typ === 'urzadzenie') deleteUrzadzenie(id);
      else if (typ === 'rozdzielnia') deleteRozdzielnia(id);
      else if (typ === 'termopara') deleteTermopara(id);
      else if (typ === 'inne') deleteInne(id);
    });
    card.querySelector('.btn-wymiana')?.addEventListener('click', () => wymianaTermopary(id));
    card.querySelector('.btn-show-devices')?.addEventListener('click', () => switchTab('urzadzenia', { rozdzielniaId: id }));
  });
}

function zdjeciaRowHtml(urls) {
  if (!urls || !urls.length) return '';
  return `<div class="photo-row">${urls.map(u =>
    `<img src="${escapeHtml(u)}" loading="lazy" alt="Zdjęcie">`).join('')}</div>`;
}

function przyciskiEdycjiHtml() {
  if (!isLoggedIn()) return '';
  return `
    <div class="btn-row">
      <button class="btn-secondary btn-edit">✏️ Edytuj</button>
      <button class="btn-danger btn-delete">🗑️ Usuń</button>
    </div>`;
}

/* ================================================================
   SEKCJA: URZĄDZENIA
================================================================ */
function renderUrzadzenia() {
  let lista = DANE.urzadzenia;
  if (filtrRozdzielni) lista = lista.filter(u => u.rozdzielnia_id === filtrRozdzielni);
  lista = posortujUrzadzenia(lista);

  const rozdzielnieOpcje = posortujRozdzielnie(DANE.rozdzielnie).map(r =>
    `<option value="${r.id}" ${filtrRozdzielni === r.id ? 'selected' : ''}>${escapeHtml(r.kod)} — ${escapeHtml(r.nazwa)}</option>`
  ).join('');

  els.content.innerHTML = `
    <label class="field">
      <span>Rozdzielnia</span>
      <select id="rozdzielnia-filter">
        <option value="">Wszystkie rozdzielnie</option>
        ${rozdzielnieOpcje}
      </select>
    </label>
    ${sortRowHtml('urzadzenia')}
    <div class="stat-chips">
      <span>Pokazane: ${lista.length}</span>
      <span>W bazie: ${DANE.urzadzenia.length} urządzeń</span>
    </div>

    <div class="row-between">
      <h2 class="section-title">Urządzenia</h2>
      ${isLoggedIn() ? `<button class="btn-primary" id="btn-add" style="width:auto;">+ Dodaj</button>` : ''}
    </div>

    <div id="form-slot"></div>
    <div id="list-slot">
      ${lista.length ? lista.map(urzadzenieCardHtml).join('') : '<p class="empty-state">Brak urządzeń spełniających kryteria.</p>'}
    </div>
  `;

  document.getElementById('rozdzielnia-filter').addEventListener('change', (e) => {
    filtrRozdzielni = e.target.value;
    render({ bezPobierania: true });
  });
  bindSortRow();
  document.getElementById('btn-add')?.addEventListener('click', () => showUrzadzenieForm());
  bindAkcjeKart();
}

async function zapiszRekord(e, id, opcje) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const przycisk = e.target.querySelector('button[type="submit"]');
  przycisk.disabled = true;
  przycisk.textContent = 'Zapisywanie…';
  try {
    const payload = opcje.buduj(fd);
    if (opcje.pm) {
      payload.zdjecia = await finalizujZdjecia(opcje.tabela, opcje.recordId, opcje.pm, opcje.stareZdjecia);
    }
    if (id) {
      const { error } = await sb.from(opcje.tabela).update(payload).eq('id', id);
      if (error) throw error;
      showAlert('Zapisano zmiany.', 'info');
    } else {
      if (opcje.recordId) payload.id = opcje.recordId;
      const { error } = await sb.from(opcje.tabela).insert(payload);
      if (error) throw error;
      showAlert('Dodano wpis.', 'info');
    }
    render();
  } catch (err) {
    showAlert('Nie udało się zapisać: ' + (err.message || err));
    przycisk.disabled = false;
    przycisk.textContent = opcje.etykieta;
  }
}

/* ================================================================
   ZDJĘCIA — kompresja, wgrywanie, edytor miniaturek
================================================================ */
function compressImage(file, maxDim = 1280, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Nie udało się odczytać pliku.'));
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => reject(new Error('Nie udało się wczytać obrazu.'));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Błąd kompresji obrazu.')), 'image/jpeg', quality);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function uploadPhotos(table, recordId, files) {
  const urls = [];
  for (const file of files) {
    const blob = await compressImage(file);
    const path = `${table}/${recordId}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
    const { error } = await sb.storage.from('zdjecia').upload(path, blob, { contentType: 'image/jpeg' });
    if (error) throw error;
    const { data } = sb.storage.from('zdjecia').getPublicUrl(path);
    urls.push(data.publicUrl);
  }
  return urls;
}

async function deleteStoragePhoto(url) {
  try {
    const marker = '/object/public/zdjecia/';
    const idx = url.indexOf(marker);
    if (idx === -1) return;
    await sb.storage.from('zdjecia').remove([url.slice(idx + marker.length)]);
  } catch (e) {
    console.warn('Nie udało się usunąć starego zdjęcia z magazynu:', e);
  }
}

function createPhotoManager(existingUrls, maxCount) {
  return { existing: [...(existingUrls || [])], files: [], maxCount };
}
function photoManagerRemaining(pm) {
  return pm.maxCount - pm.existing.length - pm.files.length;
}

function photoManagerHtml(pm, idPrefix) {
  const existingThumbs = pm.existing.map((url, i) => `
    <div class="photo-thumb">
      <img src="${escapeHtml(url)}">
      <button type="button" class="photo-remove" data-kind="existing" data-index="${i}">✕</button>
    </div>`).join('');
  const pendingThumbs = pm.files.map((file, i) => `
    <div class="photo-thumb">
      <img src="${URL.createObjectURL(file)}">
      <button type="button" class="photo-remove" data-kind="pending" data-index="${i}">✕</button>
    </div>`).join('');
  const remaining = photoManagerRemaining(pm);
  return `
    <div class="photo-picker" id="${idPrefix}-picker">
      <span style="display:block;font-size:12px;text-transform:uppercase;letter-spacing:0.04em;color:var(--text-dim);margin-bottom:6px;">Zdjęcia (maks. ${pm.maxCount})</span>
      <div class="photo-thumbs">${existingThumbs}${pendingThumbs}</div>
      ${remaining > 0
        ? `<label class="btn-secondary btn-block photo-add-label">+ Dodaj zdjęcie<input type="file" accept="image/*" class="photo-add-input" hidden></label>`
        : ''}
    </div>`;
}

function bindPhotoPicker(idPrefix, pm) {
  const container = document.getElementById(`${idPrefix}-picker`);
  if (!container) return;
  container.addEventListener('click', (e) => {
    const btn = e.target.closest('.photo-remove');
    if (!btn) return;
    if (btn.dataset.kind === 'existing') pm.existing.splice(Number(btn.dataset.index), 1);
    else pm.files.splice(Number(btn.dataset.index), 1);
    rerenderPhotoPicker(idPrefix, pm);
  });
  container.addEventListener('change', (e) => {
    if (!e.target.matches('.photo-add-input')) return;
    const file = e.target.files[0];
    if (!file) return;
    if (photoManagerRemaining(pm) <= 0) { showAlert(`Osiągnięto limit ${pm.maxCount} zdjęć.`); return; }
    pm.files.push(file);
    rerenderPhotoPicker(idPrefix, pm);
  });
}

function rerenderPhotoPicker(idPrefix, pm) {
  const container = document.getElementById(`${idPrefix}-picker`);
  if (!container) return;
  container.outerHTML = photoManagerHtml(pm, idPrefix);
  bindPhotoPicker(idPrefix, pm);
}

async function finalizujZdjecia(table, recordId, pm, originalUrls) {
  const usuniete = (originalUrls || []).filter(u => !pm.existing.includes(u));
  for (const u of usuniete) await deleteStoragePhoto(u);
  let finalne = [...pm.existing];
  if (pm.files.length) finalne = finalne.concat(await uploadPhotos(table, recordId, pm.files));
  return finalne;
}

/* ================================================================
   IMPORT / EKSPORT CSV
   Separator średnik i znacznik BOM — dzięki temu polskie Excele
   otwierają plik od razu w kolumnach i z poprawnymi znakami.
================================================================ */
function doCSV(naglowki, wiersze) {
  const esc = (v) => {
    const s = (v === null || v === undefined) ? '' : String(v);
    return /[";\n\r]/.test(s) ? '"' + s.replaceAll('"', '""') + '"' : s;
  };
  const linie = [naglowki.join(';')];
  for (const w of wiersze) linie.push(naglowki.map(h => esc(w[h])).join(';'));
  return '﻿' + linie.join('\r\n');
}

function parsujCSV(tekst) {
  tekst = tekst.replace(/^﻿/, '');
  const pierwszaLinia = tekst.split(/\r?\n/)[0] || '';
  const sep = (pierwszaLinia.split(';').length >= pierwszaLinia.split(',').length) ? ';' : ',';
  const wiersze = [];
  let pole = '', wiersz = [], wCudzyslowie = false;
  for (let i = 0; i < tekst.length; i++) {
    const z = tekst[i];
    if (wCudzyslowie) {
      if (z === '"') {
        if (tekst[i + 1] === '"') { pole += '"'; i++; }
        else wCudzyslowie = false;
      } else pole += z;
    } else if (z === '"') wCudzyslowie = true;
    else if (z === sep) { wiersz.push(pole); pole = ''; }
    else if (z === '\n') { wiersz.push(pole); wiersze.push(wiersz); wiersz = []; pole = ''; }
    else if (z !== '\r') pole += z;
  }
  if (pole !== '' || wiersz.length) { wiersz.push(pole); wiersze.push(wiersz); }
  return wiersze.filter(w => w.some(k => String(k).trim() !== ''));
}

function liczbaZCSV(tekst) {
  const s = String(tekst ?? '').trim().replace(/\s/g, '').replace(',', '.');
  if (!s) return null;
  const n = Number(s);
  return Number.isFinite(n) ? n : NaN;
}

function dataZCSV(tekst) {
  const s = String(tekst ?? '').trim();
  if (!s) return null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m = s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})$/);
  if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  return NaN;
}

function zdjeciaZCSV(tekst, stare) {
  if (tekst === undefined) return [...(stare || [])];     // kolumny brak — zostawiamy jak było
  const s = String(tekst).trim();
  if (!s) return [];
  return s.split('|').map(x => x.trim()).filter(Boolean);
}

const SCHEMATY_CSV = {

    plik: 'urzadzenia',
    kolumny: ['symbol', 'nazwa', 'rozdzielnia_kod', 'prad_znamionowy', 'napiecie', 'uwagi', 'zdjecia'],
    dane: () => posortujUrzadzenia(DANE.urzadzenia),
    doWiersza: (u) => {
      const r = rozdzielniaDla(u.rozdzielnia_id);
      return {
        symbol: u.symbol, nazwa: u.nazwa, rozdzielnia_kod: r ? r.kod : '',
        prad_znamionowy: u.prad_znamionowy, napiecie: u.napiecie,
        uwagi: u.uwagi, zdjecia: (u.zdjecia || []).join('|')
      };
    },
    importowalna: true,
    zWiersza(w, widziane) {
      const symbol = (w.symbol || '').trim();
      const nazwa = (w.nazwa || '').trim();
      const kod = (w.rozdzielnia_kod || '').trim();
      if (!symbol) return { blad: 'pusta kolumna „symbol"' };
      if (!nazwa) return { blad: 'pusta kolumna „nazwa"' };
      if (widziane.has(uprosc(symbol))) return { blad: `symbol „${symbol}" powtarza się w pliku` };
      const r = DANE.rozdzielnie.find(x => uprosc(x.kod) === uprosc(kod));
      if (!r) return { blad: `nie znaleziono rozdzielni o kodzie „${kod}"` };
      const prad = liczbaZCSV(w.prad_znamionowy);
      if (Number.isNaN(prad)) return { blad: `„${w.prad_znamionowy}" to nie jest liczba (prąd znamionowy)` };
      const nap = liczbaZCSV(w.napiecie);
      if (Number.isNaN(nap)) return { blad: `„${w.napiecie}" to nie jest liczba (napięcie)` };
      widziane.add(uprosc(symbol));
      const stary = DANE.urzadzenia.find(x => uprosc(x.symbol) === uprosc(symbol));
      return {
        istniejacy: !!stary,
        rekord: {
          id: stary ? stary.id : nowyIdentyfikator(),
          symbol, nazwa, rozdzielnia_id: r.id,
          prad_znamionowy: prad, napiecie: nap,
          uwagi: (w.uwagi || '').trim() || null,
          zdjecia: zdjeciaZCSV(w.zdjecia, stary?.zdjecia)
        }
      };
    }
  },

  rozdzielnie: {
    etykieta: '🗄️ Rozdzielnie',
    plik: 'rozdzielnie',
    kolumny: ['kod', 'nazwa', 'lokalizacja', 'google_maps_url'],
    dane: () => posortujRozdzielnie(DANE.rozdzielnie),
    doWiersza: (r) => ({ kod: r.kod, nazwa: r.nazwa, lokalizacja: r.lokalizacja, google_maps_url: r.google_maps_url }),
    importowalna: true,
    zWiersza(w, widziane) {
      const kod = (w.kod || '').trim();
      const nazwa = (w.nazwa || '').trim();
      if (!kod) return { blad: 'pusta kolumna „kod"' };
      if (!nazwa) return { blad: 'pusta kolumna „nazwa"' };
      if (widziane.has(uprosc(kod))) return { blad: `kod „${kod}" powtarza się w pliku` };
      widziane.add(uprosc(kod));
      const stary = DANE.rozdzielnie.find(x => uprosc(x.kod) === uprosc(kod));
      return {
        istniejacy: !!stary,
        rekord: {
          id: stary ? stary.id : nowyIdentyfikator(),
          kod, nazwa,
          lokalizacja: (w.lokalizacja || '').trim() || null,
          google_maps_url: (w.google_maps_url || '').trim() || null
        }
      };
    }
  },

  termopary: {
    etykieta: '🌡️ Termopary',
    plik: 'termopary',
    kolumny: ['symbol', 'nazwa', 'lokalizacja', 'status', 'ostatnia_wymiana', 'zywotnosc_dni', 'zdjecia'],
    dane: () => posortujTermopary(DANE.termopary),
    doWiersza: (t) => ({
      symbol: t.symbol, nazwa: t.nazwa, lokalizacja: t.lokalizacja, status: t.status,
      ostatnia_wymiana: t.ostatnia_wymiana, zywotnosc_dni: t.zywotnosc_dni,
      zdjecia: (t.zdjecia || []).join('|')
    }),
    importowalna: true,
    zWiersza(w, widziane) {
      const symbol = (w.symbol || '').trim();
      const nazwa = (w.nazwa || '').trim();
      if (!symbol) return { blad: 'pusta kolumna „symbol"' };
      if (!nazwa) return { blad: 'pusta kolumna „nazwa"' };
      if (widziane.has(uprosc(symbol))) return { blad: `symbol „${symbol}" powtarza się w pliku` };
      const data = dataZCSV(w.ostatnia_wymiana);
      if (data === null) return { blad: 'pusta kolumna „ostatnia_wymiana"' };
      if (Number.isNaN(data)) return { blad: `„${w.ostatnia_wymiana}" to nie jest data (oczekiwano RRRR-MM-DD lub DD.MM.RRRR)` };
      const zyw = liczbaZCSV(w.zywotnosc_dni);
      if (zyw === null || Number.isNaN(zyw) || zyw < 1) return { blad: `„${w.zywotnosc_dni}" to nie jest poprawna żywotność w dniach` };
      widziane.add(uprosc(symbol));
      const stary = DANE.termopary.find(x => uprosc(x.symbol) === uprosc(symbol));
      return {
        istniejacy: !!stary,
        rekord: {

          id: stary ? stary.id : nowyIdentyfikator(),

          nazwa,
          lokalizacja: (w.lokalizacja || '').trim() || null,
          uwagi: (w.uwagi || '').trim() || null
        }

  },

  termopary_historia: {
    etykieta: '🔧 Historia wymian',
    plik: 'historia-wymian',
    kolumny: ['termopara_symbol', 'data_wymiany'],
    dane: () => [...DANE.termopary_historia].sort((a, b) => new Date(b.data_wymiany) - new Date(a.data_wymiany)),
    doWiersza: (h) => ({
      termopara_symbol: DANE.termopary.find(t => t.id === h.termopara_id)?.symbol || '',
      data_wymiany: h.data_wymiany
    }),
    importowalna: false
  }
};

function pobierzPlik(nazwa, tresc, typ) {
  const blob = new Blob([tresc], { type: typ });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nazwa;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function eksportCSV(klucz) {
  const s = SCHEMATY_CSV[klucz];
  const wiersze = s.dane().map(s.doWiersza);
  const dzis = new Date().toISOString().slice(0, 10);
  pobierzPlik(`${s.plik}-${dzis}.csv`, doCSV(s.kolumny, wiersze), 'text/csv;charset=utf-8;');
  showAlert(`Pobrano plik: ${wiersze.length} wierszy (${s.etykieta}).`, 'info');
}

let przygotowanyImport = null;

async function wczytajPlikCSV(klucz, plik) {
  try {
    const tekst = await plik.text();
    const tabela = parsujCSV(tekst);
    if (tabela.length < 2) { showAlert('Plik nie zawiera żadnych wierszy z danymi.'); return; }

    const naglowki = tabela[0].map(h => String(h).trim().toLowerCase());
    const s = SCHEMATY_CSV[klucz];
    const brakujace = s.kolumny.filter(k => !['uwagi', 'zdjecia', 'lokalizacja', 'google_maps_url', 'status'].includes(k) && !naglowki.includes(k));
    if (brakujace.length) {
      showAlert(`W pliku brakuje kolumn: ${brakujace.join(', ')}. Najłatwiej zacząć od pliku z eksportu.`);
      return;
    }

    const doZapisu = [], bledy = [], widziane = new Set();
    let nowe = 0, aktualizacje = 0;
    for (let i = 1; i < tabela.length; i++) {
      const obiekt = {};
      naglowki.forEach((h, j) => { if (tabela[i][j] !== undefined) obiekt[h] = tabela[i][j]; });
      const wynik = s.zWiersza(obiekt, widziane);
      if (wynik.blad) { bledy.push(`Wiersz ${i + 1}: ${wynik.blad}`); continue; }
      doZapisu.push(wynik.rekord);
      if (wynik.istniejacy) aktualizacje++; else nowe++;
    }
    przygotowanyImport = { klucz, doZapisu, bledy, nowe, aktualizacje, nazwaPliku: plik.name };
    pokazPodsumowanieImportu();
  } catch (err) {
    showAlert('Nie udało się odczytać pliku: ' + (err.message || err));
  }
}

function pokazPodsumowanieImportu() {
  const slot = document.getElementById('import-podsumowanie');
  if (!slot || !przygotowanyImport) return;
  const p = przygotowanyImport;
  const s = SCHEMATY_CSV[p.klucz];
  slot.innerHTML = `
    <div class="import-sum">
      <div class="podsumowanie">
        Plik <b>${escapeHtml(p.nazwaPliku)}</b> → ${escapeHtml(s.etykieta)}<br>
        Do dodania: <b>${p.nowe}</b> · Do aktualizacji: <b>${p.aktualizacje}</b> · Pominięte: <b>${p.bledy.length}</b>
        ${p.bledy.length ? `<ul>${p.bledy.slice(0, 8).map(b => `<li>${escapeHtml(b)}</li>`).join('')}
          ${p.bledy.length > 8 ? `<li>…i jeszcze ${p.bledy.length - 8}</li>` : ''}</ul>` : ''}
      </div>
      ${p.doZapisu.length
        ? `<button class="btn-primary btn-block" id="btn-import-wykonaj">Zapisz ${p.doZapisu.length} wpisów do bazy</button>`
        : `<p class="hint" style="margin:0;">Brak poprawnych wierszy do zapisania.</p>`}
    </div>`;
  document.getElementById('btn-import-wykonaj')?.addEventListener('click', wykonajImport);
}

async function wykonajImport() {
  const p = przygotowanyImport;
  if (!p || !p.doZapisu.length) return;
  const przycisk = document.getElementById('btn-import-wykonaj');
  przycisk.disabled = true;
  przycisk.textContent = 'Zapisywanie…';
  const { error } = await sb.from(p.klucz).upsert(p.doZapisu);
  if (error) {
    showAlert('Import nie powiódł się: ' + error.message);
    przycisk.disabled = false;
    przycisk.textContent = `Zapisz ${p.doZapisu.length} wpisów do bazy`;
    return;
  }
  showAlert(`Zaimportowano: ${p.nowe} nowych, ${p.aktualizacje} zaktualizowanych.`, 'info');
  przygotowanyImport = null;
  render();
}
